name: Numerical and server smoke checks
on: [push, pull_request]
jobs:
  cpu-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python server.py doctor
      - run: python -m unittest discover -s tests -v
      - run: python server.py init runs/ci --profile smoke --workers 2
      - run: python server.py run runs/ci
      - run: python tests/check_smoke.py runs/ci
      - run: python server.py run runs/ci
      - run: python tests/check_smoke.py runs/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cpu-smoke-results
          path: runs/ci
